<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>移転のお知らせ | My Ramen DB 88</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: linear-gradient(160deg, #1c1917 0%, #292524 60%, #450a0a 100%);
      color: #fafaf9;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      color: #1c1917;
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      border-top: 6px solid #dc2626;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    p {
      font-size: 14px;
      color: #44403c;
      line-height: 1.75;
      margin-bottom: 20px;
    }
    .new-url-box {
      background: #faf5eb;
      border: 1px solid #e7e5e4;
      border-radius: 14px;
      padding: 12px;
      font-size: 12px;
      color: #57534e;
      word-break: break-all;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      background: #dc2626;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 900;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #b91c1c;
    }
    .sub-note {
      margin-top: 14px;
      margin-bottom: 0;
      font-size: 12px;
      color: #78716c;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">サーバー・クラウド移行完了</div>
    <h1>新しい環境へお引越ししました</h1>
    <p>
      本サイトは新サーバーおよび新クラウド環境へ完全移行しました。<br />
      今後は新しいURLからアクセスしてください（旧サイトでの編集・保存は停止しています）。
    </p>
    <div class="new-url-box">
      <strong>新URL:</strong> <span id="newSiteUrlText">https://hayto88.github.io/My-ramen-DB88-v2/</span>
    </div>
    <a id="newSiteLinkBtn" class="btn" href="https://YOUR-NEW-GITHUB-USERNAME.github.io/YOUR-NEW-REPO/">
      新しいサイトへ移動する
    </a>
    <p class="sub-note">
      ブックマークの更新をお願いいたします。
    </p>
  </main>

  <script>
    (() => {
      // 【設定】引越し先の新URLをここに設定してください
      const NEW_SITE_URL = 'https://hayto88.github.io/My-ramen-DB88-v2/';
      const textEl = document.getElementById('newSiteUrlText');
      const linkEl = document.getElementById('newSiteLinkBtn');
      if (textEl) textEl.textContent = NEW_SITE_URL;
      if (linkEl) linkEl.href = NEW_SITE_URL;
    })();
  </script>
</body>
</html>
